# Caryvn Backend - Railway Deployment
# startCommand is intentionally NOT set here so each Railway service
# can have its own custom start command configured in the Railway UI:
#   web service    → gunicorn ...
#   celery worker  → celery -A config worker --beat --loglevel=info -Q default

[build]
builder = "nixpacks"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
